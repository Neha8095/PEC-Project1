<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="nav"><div class="brand">⚙️ Admin</div><div class="nav-links"><a href="users.html">Users</a><a href="n8n-workflows.html">n8n Workflows</a><a href="/librarian/manage-books.html">Books</a><button class="btn danger" onclick="logout()">Logout</button></div></nav><div class="container"><h1>Admin Dashboard</h1><div id="dashboardMessage" role="status" aria-live="polite"></div><div class="grid"><div class="card">Users<div id="userCount" class="stat">-</div></div><div class="card">Books<div id="bookCount" class="stat">-</div></div><div class="card">Issues<div id="issueCount" class="stat">-</div></div><div class="card">Overdue<div id="overdueCount" class="stat">-</div></div><div class="card">Fines<div id="fineTotal" class="stat">-</div></div></div></div><script src="/js/app.js"></script><script>roleGuard('ADMIN');(async()=>{const message=document.getElementById('dashboardMessage');try{const data=await api('/dashboard/admin');document.getElementById('userCount').textContent=data.users;document.getElementById('bookCount').textContent=data.books;document.getElementById('issueCount').textContent=data.issues;document.getElementById('overdueCount').textContent=data.overdue;document.getElementById('fineTotal').textContent='₹'+data.fines}catch(error){message.className='alert';message.textContent=error.message||'Could not load the dashboard.'}})()</script></body></html>
