<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Notifications</title><link rel=stylesheet href=/css/style.css></head><body><nav class=nav><div class=brand>🔔 Notifications</div><div class=nav-links><a href=dashboard.html>Dashboard</a><button class="btn danger" onclick=logout()>Logout</button></div></nav><div class=container><div id=list class=grid></div></div><script src=/js/app.js></script><script>guard();(async()=>{const d=await api('/notifications');list.innerHTML=d.notifications.map(n=>`<div class=card><span class=badge>${n.type}</span><h3>${n.title}</h3><p>${n.message}</p>${!n.is_read?`<button class="btn secondary" onclick=readN(${n.id})>Mark read</button>`:''}</div>`).join('')})();async function readN(id){await api('/notifications/'+id+'/read',{method:'PUT'});location.reload()}</script></body></html>
