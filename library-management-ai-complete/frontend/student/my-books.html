<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>My Books</title><link rel=stylesheet href=/css/style.css></head><body><nav class=nav><div class=brand>📚 My Books</div><div class=nav-links><a href=dashboard.html>Dashboard</a><button class="btn danger" onclick=logout()>Logout</button></div></nav><div class=container><h1>Borrowed Books</h1><table><thead><tr><th>Book</th><th>Due</th><th>Status</th><th>Action</th></tr></thead><tbody id=rows></tbody></table></div><script src=/js/app.js></script><script>guard();async function load(){const d=await api('/issues/my');rows.innerHTML=d.issues.map(i=>`<tr><td>${i.title}<br><span class=muted>${i.author}</span></td><td>${String(i.due_date).slice(0,10)}</td><td>${i.status}</td><td>${i.status==='RETURNED'?'Returned':`<button class="btn primary" onclick=renew(${i.id})>Renew</button> <button class="btn secondary" onclick=ret(${i.id})>Return</button>`}</td></tr>`).join('')}async function renew(id){try{alert((await api('/issues/'+id+'/renew',{method:'POST'})).message);load()}catch(e){alert(e.message)}}async function ret(id){try{const d=await api('/issues/'+id+'/return',{method:'POST'});alert(d.message+' Fine ₹'+d.fine);load()}catch(e){alert(e.message)}}load()</script></body></html>
