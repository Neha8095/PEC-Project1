<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="form">
    <h2>📚 LibraryAI Login</h2>
    <div id="msg"></div>

    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email" value="student1@library.com" required>

      <label for="password">Password</label>
      <input id="password" type="password" value="Student@123" required>

      <button type="submit" class="btn primary" style="width:100%">Login</button>
    </form>

    <p>New student? <a href="/register.html">Register</a></p>
    <p class="muted">Admin: admin@library.com / Admin@123<br>Librarian: librarian@library.com / Librarian@123</p>
  </div>

  <script src="/js/app.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const msg = document.getElementById('msg');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const emailValue = email.value.trim();
        const passwordValue = password.value;

        if (!emailValue || !passwordValue) {
          msg.innerHTML = '<div class="alert">Please enter both email and password.</div>';
          return;
        }

        try {
          const d = await api('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email: emailValue, password: passwordValue })
          });

          localStorage.setItem('library_token', d.token);
          localStorage.setItem('library_user', JSON.stringify(d.user));
          location.href = dash();
        } catch (error) {
          msg.innerHTML = '<div class="alert">' + (error.message || 'Login failed.') + '</div>';
        }
      });
    });
  </script>
</body>
</html>
