<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Issues</title><link rel=stylesheet href=/css/style.css></head><body><nav class=nav><div class=brand>📋 Issues</div><div class=nav-links><a href=dashboard.html>Dashboard</a><button class="btn danger" onclick=logout()>Logout</button></div></nav><div class=container><table><thead><tr><th>Student</th><th>Book</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody id=rows></tbody></table></div><script src=/js/app.js></script><script>roleGuard('LIBRARIAN','ADMIN');(async()=>{const d=await api('/issues');rows.innerHTML=d.issues.map(i=>`<tr><td>${i.full_name}<br>${i.student_id||''}</td><td>${i.title}</td><td>${String(i.due_date).slice(0,10)}</td><td>${i.status}</td><td>${i.status!=='RETURNED'?`<button class="btn secondary" onclick=ret(${i.id})>Return</button>`:'Returned'}</td></tr>`).join('')})();async function ret(id){try{await api('/issues/'+id+'/return',{method:'POST'});location.reload()}catch(e){alert(e.message)}}</script></body></html>
