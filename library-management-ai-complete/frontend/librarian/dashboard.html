<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Librarian</title><link rel="stylesheet" href="/css/style.css"></head><body><nav class="nav"><div class="brand">📚 Librarian</div><div class="nav-links"><a href="manage-books.html">Books</a><a href="issues.html">Issues</a><a href="students.html">Students</a><button class="btn danger" onclick="logout()">Logout</button></div></nav><div class="container"><h1>Librarian Dashboard</h1><div id="dashboardMessage" role="status" aria-live="polite"></div><div class="grid"><div class="card">Books<div id="bookCount" class="stat">-</div></div><div class="card">Available Copies<div id="availableCopies" class="stat">-</div></div><div class="card">Issued<div id="issuedCount" class="stat">-</div></div><div class="card">Overdue<div id="overdueCount" class="stat">-</div></div><div class="card">Students<div id="studentCount" class="stat">-</div></div></div></div><script src="/js/app.js"></script><script>roleGuard('LIBRARIAN','ADMIN');(async()=>{const message=document.getElementById('dashboardMessage');try{const data=await api('/dashboard/librarian');document.getElementById('bookCount').textContent=data.totalBooks;document.getElementById('availableCopies').textContent=data.availableCopies;document.getElementById('issuedCount').textContent=data.issued;document.getElementById('overdueCount').textContent=data.overdue;document.getElementById('studentCount').textContent=data.students}catch(error){message.className='alert';message.textContent=error.message||'Could not load the dashboard.'}})()</script></body></html>
